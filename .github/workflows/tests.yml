# Runs every suite on every push and pull request. The prototype has no build step and no
# dependencies; Playwright is installed here only for the browser suites (tests/README.md). Two more
# checkouts sit next to the app: ViciDesign at the commit vici/ was copied from, so the suites can use
# Vici's own checks and compare vici/ with it byte for byte, and this repository at release 1.0.0, so
# tests/figures.mjs can rebuild data/story.js from 1.0.0's engines and compare.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Figures, files, lean, Vici's checks, and the prototype in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          repository: VictorPflueger/ViciDesign
          ref: d04a318a534e891fe91a2773c0afa737500510a9
          path: ViciDesign
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 737761935b5a28f8d80744b43950798a7f8d59e4
          path: legacy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.0-chromium-${{ runner.os }}
      - run: npm install -g playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: All suites
        working-directory: app
        run: NODE_PATH="$(npm root -g)" node tests/run-all.mjs --require-vici --require-legacy
        env:
          DR_LEGACY: ${{ github.workspace }}/legacy
          DR_TEST_OUT: ${{ runner.temp }}/duty-radar-tests
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: ${{ runner.temp }}/duty-radar-tests
